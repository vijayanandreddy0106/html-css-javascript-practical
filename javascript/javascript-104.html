  <main class="wrap">
   <div class="card">
    <span class="num">
     Program 104
    </span>
    <h2 class="page-title">
     Create a digital calculator.
    </h2>
    <p class="hint">
     Try the program below. Change the input values and click Run.
    </p>
    <div class="demo">
     <div class="demo-grid">
      <input class="input" id="a" placeholder="First" type="number" value=""/>
      <input class="input" id="b" placeholder="Second" type="number" value=""/>
      <select id="op">
       <option>
        +
       </option>
       <option>
        -
       </option>
       <option>
        *
       </option>
       <option>
        /
       </option>
      </select>
     </div>
     <button class="btn" onclick="run()">
      Calculate
     </button>
     <div class="output" id="out">
      Output appears here...
     </div>
    </div>
    <h3>
     Program Code
    </h3>
    <textarea class="code" readonly="">
const a=10,b=5;
console.log(a+b,a-b,a*b,a/b);
</textarea>
   </div>
   <div class="program-actions">
    <a class="btn" href="javascript-103.html">

  <footer>
   HTML &bull; CSS &bull; JavaScript Practical Programs
  </footer>
  <script>
   function run() {
    let x=+a.value,y=+b.value,o=op.value;
    if(o==='/'&&y===0) {
        out.textContent='Cannot divide by zero';
        return
    }
    out.textContent='Result: '+( {
        '+':x+y,'-':x-y,'*':x*y,'/':x/y
    }
    [o])
}
  </script>
