    <h2 class="page-title">

    </h2>
    <p class="hint">

    <div class="demo">
     <div class="demo-grid">

     </div>
    </div>
    <h3>
     Program Code
    </h3>
    <textarea class="code" readonly="">
const arr=[5,2,8,1];
arr.sort((a,b)=&gt;a-b);
console.log(arr);

  <script>
   function run() {
    let x=a.value.split(',').map(Number).filter(Number.isFinite);
    x.sort((p,q)=>p-q);
    out.textContent=x.join(', ')
}
