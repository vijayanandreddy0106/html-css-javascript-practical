    <h2 class="page-title">
     Create a number guessing game.
    </h2>
    <p class="hint">
     Try the program below. Change the input values and click Run.
    </p>
    <div class="demo">
     <input class="input" id="a" placeholder="Guess 1-100" type="number" value=""/>
     <button class="btn" onclick="run()">
      Guess
     </button>
     <button class="btn" onclick="newGame()">
      New Game
     </button>
     <div class="output" id="out">
      Output appears here...
     </div>
    </div>
    <h3>
     Program Code
    </h3>
    <textarea class="code" readonly="">
let target=Math.floor(Math.random()*100)+1;
console.log(target);
</textarea>

  <script>
   let target=Math.floor(Math.random()*100)+1;
function newGame() {
    target=Math.floor(Math.random()*100)+1;
    out.textContent='New number selected.'
}
function run() {
    let g=+a.value;
    if(g===target)out.textContent='Correct!';
    else out.textContent=g<target?'Too low':'Too high'
}
  </script>
