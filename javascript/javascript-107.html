    <h2 class="page-title">
     Create a countdown timer.
    </h2>
    <p class="hint">
     Try the program below. Change the input values and click Run.
    </p>
    <div class="demo">
     <input class="input" id="a" placeholder="Seconds" type="number" value="10"/>
     <button class="btn" onclick="startTimer()">
      Start
     </button>
     <button class="btn" onclick="resetTimer()">
      Reset
     </button>
     <div class="mini big-output" id="timer">
      10
     </div>
     <div class="output" id="out">
      Output appears here...
     </div>
    </div>
    <h3>
     Program Code
    </h3>
    <textarea class="code" readonly="">
let seconds=10;
const id=setInterval(()=&gt; {
    console.log(seconds--);
    if(seconds&lt;0)clearInterval(id)
},1000);
</textarea>

  <script>
   let timerId;
function startTimer() {
    clearInterval(timerId);
    let n=Math.max(0,Math.floor(+a.value));
    timer.textContent=n;
    timerId=setInterval(()=> {
        n--;
        timer.textContent=n;
        if(n<=0)clearInterval(timerId)
    },1000)
}
function resetTimer() {
    clearInterval(timerId);
    timer.textContent=a.value
}
  </script>
